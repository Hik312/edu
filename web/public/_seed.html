<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>调试入口</title>
</head>
<body>
<script>
/* 调试 / 冒烟专用：用测试账号换一个 JWT 塞进 localStorage，再跳到目标页。
 *
 * 为什么需要它：headless 截图工具没法在页面执行前注入存储，而除了登录页
 * 之外所有页面都有路由守卫。借一个真实页面把 token 写进去是最省事的办法。
 *
 * 用法：_seed.html?to=/docs        跳到文档页
 *       _seed.html                  默认跳驾驶舱
 *       _seed.html?user=x&pass=y    换账号（默认是契约测试的探针账号）
 *
 * 放在 public/ 下：dev server 和构建产物都能访问到同一份。
 * 它不引用任何业务代码，所以打包体积可以忽略。
 */
(async function () {
  var q = new URLSearchParams(location.search)
  try {
    var r = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: q.get('user') || 'zz_check_probe',
        password: q.get('pass') || 'zz_check_123456'
      })
    })
    var d = await r.json()
    if (d && d.token) localStorage.setItem('edupath.token', d.token)
  } catch (e) {
    /* 登录失败就不写 token，让路由守卫把我们踢回登录页 —— 
       这样截出来的是登录页，一眼就知道是账号问题而不是页面坏了 */
  }
  location.replace(q.get('to') || '/dashboard')
})()
</script>
</body>
</html>
