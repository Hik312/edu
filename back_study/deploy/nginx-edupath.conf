# /etc/nginx/sites-available/edupath（setup.sh 会替换域名并软链到 sites-enabled）
# 证书由 certbot --nginx 自动补：跑完后这个文件会被加上 443 段和 80→443 跳转。
server {
    listen 80;
    server_name api.example.com;

    location / {
        # 端口要和 start_backend.sh 里 `run.py <port>` 保持一致。线上跑 8081 是因为
    # 这台机器上 8080 已被一个旧的 Java 项目占着（listen *:8080），别去动它。
    # 用宝塔的话这整段就是「网站 → 反代」里那几条规则，效果相同；
    # 关键是 proxy_pass 指向 127.0.0.1，后端不直接对公网。
    proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE（文档问答流式回答）必须关缓冲：开着的话 nginx 会攒满一桶再发，
        # 前端表现为「转圈几十秒然后整段砸出来」，流式等于没有。
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        # 云端模型一章精读可能跑一两分钟，默认 60s 会半路掐断
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # 与后端 16MB 请求体闸门对齐：nginx 默认 1m，不改的话导入大 PDF
        # 会先吃 nginx 的 413，后端那道闸门根本摸不到
        client_max_body_size 16m;
    }
}